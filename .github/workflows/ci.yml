name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/evaluate_dataset.py --dataset data/demo_cases.json --min-pass-rate 0.80 --report artifacts/demo-report.json
